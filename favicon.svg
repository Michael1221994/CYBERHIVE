<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon points="32,2 60,17 60,47 32,62 4,47 4,17" fill="#07070e" stroke="url(#amberGlow)" stroke-width="2.5" />

  <!-- Inner Cybernetic Veins / Wing Grid -->
  <path d="M32,2 L32,62 M4,17 L60,47 M4,47 L60,17" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />
  
  <!-- Cyber Bee Antennae / EMF Sensor Nodes -->
  <path d="M26,14 L32,22 L38,14" fill="none" stroke="url(#cyanBeam)" stroke-width="2" stroke-linecap="round" />
  <circle cx="25" cy="13" r="1.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="39" cy="13" r="1.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Stylized Geometric Cyber Bee Body -->
  <!-- Thorax -->
  <polygon points="32,24 40,30 40,38 32,44 24,38 24,30" fill="#181829" stroke="url(#amberGlow)" stroke-width="2" />
  
  <!-- Glowing Waggle Core (Abdomen Node) -->
  <polygon points="32,32 37,35 37,47 32,53 27,47 27,35" fill="url(#amberGlow)" filter="url(#glow)" />

  <!-- Electric Cyan Wing Pulses -->
  <path d="M24,30 Q12,22 10,34 Q20,38 24,36" fill="rgba(6, 182, 212, 0.4)" stroke="url(#cyanBeam)" stroke-width="1.5" />
  <path d="M40,30 Q52,22 54,34 Q44,38 40,36" fill="rgba(6, 182, 212, 0.4)" stroke="url(#cyanBeam)" stroke-width="1.5" />

  <!-- Central Energy Spark -->
  <circle cx="32" cy="40" r="2" fill="#ffffff" filter="url(#glow)" />
</svg>
